name: Expand HydroCast source bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    if: github.repository == 'rtqayyum/hydrocast-llm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand and publish verified source files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bootstrap/source.tar.xz.b64 ]]; then
            echo "No pending bundle; nothing to publish."
            exit 0
          fi
          base64 -d bootstrap/source.tar.xz.b64 > /tmp/hydrocast-source.tar.xz
          echo "87b4fb238a3ae89fc68d3fda36767bd476e2f8f0cf89e80eceee8ac0db307bf9  /tmp/hydrocast-source.tar.xz" | sha256sum --check
          tar -tJf /tmp/hydrocast-source.tar.xz | grep -Eq '^src/hydrocast/cli.py$'
          tar -xJf /tmp/hydrocast-source.tar.xz -C .
          rm -f bootstrap/source.tar.xz.b64
          rmdir bootstrap 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish HydroCast-LLM Phase 0 source files"
            git push
          fi
